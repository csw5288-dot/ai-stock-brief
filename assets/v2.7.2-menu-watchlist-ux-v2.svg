  <rect x="716" y="170" width="246" height="400" rx="18" fill="#061523" stroke="#50677b"/><text class="kr small" x="735" y="199">🧚  FIXIE AI STOCK BRIEF BOT</text><g class="kr phoneText"><text x="744" y="246">/menu      메인 메뉴</text><text x="744" y="292">/analyze   관심종목 분석</text><text x="744" y="338">/settings  설정</text><text x="744" y="384">/kr        국내시장</text><text x="744" y="430">/us        미국시장</text><text x="744" y="476">/help      도움말</text></g><text class="kr small" x="839" y="592" text-anchor="middle">핵심 6개 명령만 노출</text><text class="kr xs" x="839" y="612" text-anchor="middle">더 깔끔하고 직관적으로!</text>
  <rect x="976" y="170" width="246" height="400" rx="18" fill="#061523" stroke="#50677b"/><text class="kr small" x="1099" y="207" text-anchor="middle">🏠 메인 메뉴</text><g><rect x="994" y="232" width="210" height="45" rx="10" fill="#243647"/><text class="kr phoneText" x="1099" y="260" text-anchor="middle">📊 종목 분석</text><rect x="994" y="286" width="210" height="45" rx="10" fill="#243647"/><text class="kr phoneText" x="1099" y="314" text-anchor="middle">⭐ 관심종목</text><rect x="994" y="340" width="210" height="45" rx="10" fill="#243647"/><text class="kr phoneText" x="1099" y="368" text-anchor="middle">🌐 시장정보</text><rect x="994" y="394" width="210" height="45" rx="10" fill="#243647"/><text class="kr phoneText" x="1099" y="422" text-anchor="middle">🔔 알림 설정</text><rect x="994" y="448" width="210" height="45" rx="10" fill="#243647"/><text class="kr phoneText" x="1099" y="476" text-anchor="middle">🌙 조용한 시간</text><rect x="994" y="502" width="210" height="45" rx="10" fill="#243647"/><text class="kr phoneText" x="1099" y="530" text-anchor="middle">❓ 도움말</text></g><text class="kr small" x="1099" y="592" text-anchor="middle">/menu 메인 메뉴</text><text class="kr xs" x="1099" y="612" text-anchor="middle">홈에서 필요한 기능으로 빠르게 이동</text>
  <rect x="1236" y="170" width="244" height="400" rx="18" fill="#061523" stroke="#50677b"/><text class="kr small" x="1358" y="207" text-anchor="middle">⚙ 설정센터</text><g><rect x="1254" y="232" width="208" height="45" rx="10" fill="#243647"/><text class="kr phoneText" x="1358" y="260" text-anchor="middle">⭐ 관심종목 관리</text><rect x="1254" y="286" width="208" height="45" rx="10" fill="#243647"/><text class="kr phoneText" x="1358" y="314" text-anchor="middle">🔔 알림 설정</text><rect x="1254" y="340" width="208" height="45" rx="10" fill="#243647"/><text class="kr phoneText" x="1358" y="368" text-anchor="middle">✉ 모닝 브리핑</text><rect x="1254" y="394" width="208" height="45" rx="10" fill="#243647"/><text class="kr phoneText" x="1358" y="422" text-anchor="middle">🌙 조용한 시간</text><rect x="1254" y="448" width="208" height="45" rx="10" fill="#243647"/><text class="kr phoneText" x="1358" y="476" text-anchor="middle">📊 사용량</text><rect x="1254" y="502" width="208" height="45" rx="10" fill="#243647"/><text class="kr phoneText" x="1358" y="530" text-anchor="middle">🏠 메인 메뉴로</text></g><text class="kr small" x="1358" y="592" text-anchor="middle">/settings 설정센터</text><text class="kr xs" x="1358" y="612" text-anchor="middle">관심종목·알림·브리핑까지 한눈에</text>
