  <g><rect x="326" y="654" width="282" height="290" rx="18" fill="#0a1d2d" stroke="#38526a"/><circle cx="364" cy="690" r="19" fill="#168cf0"/><text class="kr num" x="364" y="697" text-anchor="middle">2</text><text class="kr feature" x="394" y="697">오타 후보 추천</text><text class="kr featureSub" x="344" y="726">오타 시 후보를 추천해 정확한 추가 지원</text><rect x="344" y="756" width="246" height="143" rx="12" fill="#11283a"/><text class="kr small" x="360" y="782">혹시 아래 종목이 맞나요?</text><text class="kr phoneText" x="360" y="820">🟢 삼성전자   005930</text><text class="kr phoneText" x="360" y="853">🟡 삼성전기   009150</text><text class="kr phoneText" x="360" y="886">⚪ 삼성중공업 010140</text><rect x="344" y="907" width="150" height="30" rx="8" fill="#166c48"/><text class="kr xs" x="419" y="927" text-anchor="middle">✅ 추가 완료</text></g>
  <g><rect x="616" y="654" width="282" height="290" rx="18" fill="#0a1d2d" stroke="#38526a"/><circle cx="654" cy="690" r="19" fill="#168cf0"/><text class="kr num" x="654" y="697" text-anchor="middle">3</text><text class="kr feature" x="684" y="697">순서 변경</text><text class="kr featureSub" x="634" y="726">드래그 없이 버튼으로 간편하게 변경</text><rect x="634" y="756" width="246" height="135" rx="12" fill="#11283a"/><text class="kr phoneText" x="650" y="786">1  삼성전자</text><text class="kr phoneText" x="650" y="812">2  SK하이닉스</text><text class="kr phoneText" x="650" y="838">3  현대차</text><text class="kr phoneText" x="650" y="864">4  네이버</text><rect x="634" y="904" width="117" height="30" rx="8" fill="#1c547b"/><text class="kr xs" x="692" y="924" text-anchor="middle">⬆ 위로</text><rect x="763" y="904" width="117" height="30" rx="8" fill="#1c547b"/><text class="kr xs" x="821" y="924" text-anchor="middle">⬇ 아래로</text></g>
  <g><rect x="906" y="654" width="282" height="290" rx="18" fill="#0a1d2d" stroke="#38526a"/><circle cx="944" cy="690" r="19" fill="#168cf0"/><text class="kr num" x="944" y="697" text-anchor="middle">4</text><text class="kr feature" x="974" y="697">순서가 분석 결과에 반영</text><text class="kr featureSub" x="924" y="726">변경한 순서가 분석 요약과 버튼에도 동일</text><rect x="924" y="756" width="246" height="152" rx="12" fill="#11283a"/><text class="kr small" x="940" y="784">분석 결과 (관심종목 순서)</text><text class="kr phoneText" x="940" y="818">1  삼성전자       78점  ▲</text><text class="kr phoneText" x="940" y="848">2  SK하이닉스     76점  ─</text><text class="kr phoneText" x="940" y="878">3  현대차         69점  ▲</text><text class="kr xs" x="940" y="932">※ 요약·종목 버튼·모닝 브리핑 동일 적용</text></g>
