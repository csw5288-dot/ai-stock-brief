  <rect x="54" y="170" width="260" height="400" rx="18" fill="#061523" stroke="#50677b"/><text class="kr small" x="74" y="199">←  🧚  FIXIE AI STOCK BRIEF BOT</text><line x1="70" y1="214" x2="296" y2="214" stroke="#344a5e"/>
  <g class="kr phoneText"><text x="78" y="244">/analyze   관심종목 분석</text><text x="78" y="276">/list      관심종목 목록</text><text x="78" y="308">/add       종목 추가</text><text x="78" y="340">/remove    종목 삭제</text><text x="78" y="372">/usage     사용량 확인</text><text x="78" y="404">/alerts_on 알림 켜기</text><text x="78" y="436">/alerts_off 알림 끄기</text><text x="78" y="468">/settings  설정</text><text x="78" y="500">/site      홈페이지</text><text x="78" y="532">/help      도움말</text></g>
  <rect x="324" y="170" width="302" height="400" rx="18" fill="#061523" stroke="#50677b"/><text class="kr small" x="344" y="199">←  🧚  FIXIE AI STOCK BRIEF BOT</text><rect x="505" y="224" width="99" height="34" rx="16" fill="#8b42c7"/><text class="kr phoneText" x="554" y="246" text-anchor="middle">/add</text><rect x="344" y="271" width="240" height="94" rx="12" fill="#243647"/><text class="kr phoneText" x="360" y="297">❌ 종목 추가 실패</text><text class="kr phoneMuted" x="360" y="320">/add 뒤에 종목명 또는</text><text class="kr phoneMuted" x="360" y="339">6자리 종목코드를 입력하세요.</text><rect x="489" y="388" width="115" height="34" rx="16" fill="#8b42c7"/><text class="kr phoneText" x="546" y="410" text-anchor="middle">/remove</text><rect x="344" y="436" width="240" height="72" rx="12" fill="#243647"/><text class="kr phoneText" x="360" y="462">❌ 종목 삭제 실패</text><text class="kr phoneMuted" x="360" y="484">명령어 뒤에 종목명을 입력하세요.</text>
