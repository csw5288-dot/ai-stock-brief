name: One-shot homepage feedback popup patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-feedback-popup.yml

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add private feedback popup entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_nav = "<a href='#manual'>항목 설명</a></nav>"
          new_nav = (
              "<a href='#manual'>항목 설명</a>"
              "<a href='https://tally.so/r/7R7qGR' target='_blank' rel='noopener noreferrer' "
              "data-tally-open='7R7qGR' data-tally-layout='modal' data-tally-width='540' "
              "data-tally-hide-title='1' data-tally-overlay='1' data-tally-auto-close='1800' "
              "aria-label='AI STOCK BRIEF 문의 및 피드백 보내기'>문의·피드백</a></nav>"
          )
          if old_nav not in text:
              raise SystemExit('expected nav fragment not found')
          text = text.replace(old_nav, new_nav, 1)

          widget = "<script async src='https://tally.so/widgets/embed.js'></script>"
          if widget not in text:
              if '</body>' not in text:
                  raise SystemExit('body closing tag not found')
              text = text.replace('</body>', widget + '</body>', 1)

          required = [
              "data-tally-open='7R7qGR'",
              '문의·피드백',
              "https://tally.so/widgets/embed.js",
              "id='features'",
              "id='history'",
              "id='validation'",
              "id='guide'",
              "id='manual'",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'homepage integrity check failed: {marker}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/add-feedback-popup.yml
          git commit -m "Add private feedback popup"
          git push
