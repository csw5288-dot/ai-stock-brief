name: Fix UX image reference

on:
  push:
    paths:
      - '.github/workflows/fix-ux-image.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace broken binary image with SVG
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'assets/v2.7.2-menu-watchlist-ux.webp'
          new = 'assets/v2.7.2-menu-watchlist-ux-v2.svg'
          if old not in text:
              raise SystemExit('old image reference not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/fix-ux-image.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-ux-image.yml
          git commit -m 'Fix v2.7.2 UX image rendering'
          git push origin HEAD:main
