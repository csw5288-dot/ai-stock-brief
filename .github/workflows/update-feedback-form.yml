name: One-shot feedback form link updater

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-feedback-form.yml

permissions:
  contents: write

jobs:
  update-feedback-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point homepage feedback popup to final Tally form
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_id = '7R7qGR'
          new_id = 'EkoK44'

          if old_id not in text:
              raise SystemExit('old Tally form id not found in index.html')

          text = text.replace(f'https://tally.so/r/{old_id}', f'https://tally.so/r/{new_id}')
          text = text.replace(f"data-tally-open='{old_id}'", f"data-tally-open='{new_id}'")

          required = [
              f"https://tally.so/r/{new_id}",
              f"data-tally-open='{new_id}'",
              '문의·피드백',
              'https://tally.so/widgets/embed.js',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'homepage integrity check failed: {marker}')

          if old_id in text:
              raise SystemExit('old Tally form id still remains after replacement')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit final form link and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/update-feedback-form.yml
          git commit -m "Point feedback popup to final Tally form"
          git push
