name: One-shot homepage Morning Briefing status patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-morning-status.yml

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Morning Briefing status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'missing expected homepage fragment: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              ".badge-next{background:#7c3aed;color:#fff}.dev-arrow{",
              ".badge-next{background:#7c3aed;color:#fff}.badge-check{background:#f59e0b;color:#fff}.dev.review{border-color:#fbbf24;background:#fffbeb}.dev.review .dev-v{color:#b45309}.release-v.review{color:#92400e;background:#fef3c7}.dev-arrow{",
              'review styles',
          )

          replace_once(
              '시장 흐름, 관심종목의 Technical Edge·Risk·Confidence, 주요 기술지표와 뉴스를 정리해 텔레그램으로 전달합니다. 모닝 브리핑과 장중 기술신호 변화 알림도 지원합니다.',
              '시장 흐름, 관심종목의 Technical Edge·Risk·Confidence, 주요 기술지표와 뉴스를 정리해 텔레그램으로 전달합니다. 장중 기술신호 변화 알림을 지원하며, 모닝 브리핑은 현재 데이터 일관성 검증을 위해 잠시 점검 중입니다.',
              'hero copy',
          )

          replace_once(
              "<div class='q'><strong>모닝 브리핑</strong><span>매일 08:00 KST 관심종목 상태와 이전 분석 대비 주요 변화를 정리합니다.</span></div>",
              "<div class='q'><strong>모닝 브리핑 · 점검 중</strong><span>관심종목의 아침 상태와 이전 분석 대비 변화를 정리하는 기능입니다. 현재 일반 분석과의 데이터 기준·판단 일관성 검증을 위해 잠시 점검 중입니다.</span></div>",
              'feature card',
          )

          replace_once(
              "<div class='dev'><div class='dev-v'>v2.5</div><strong>Morning Briefing</strong><p>매일 08:00 KST 관심종목 자동 브리핑과 이전 결과 대비 변화 비교 기능을 추가했습니다.</p></div>",
              "<div class='dev review'><span class='badge badge-check'>점검 중</span><div class='dev-v'>v2.5</div><strong>Morning Briefing</strong><p>자동 브리핑 기능은 구현 완료 상태이며, 현재 일반 분석과 동일한 데이터 기준·판단 결과가 유지되는지 추가 검증을 진행하고 있습니다.</p></div>",
              'v2.5 development card',
          )

          pattern = re.compile(
              r"<div class='release'><div class='release-top'><span class='release-v'>v2\.5</span><span class='release-title'>Morning Briefing</span></div><ul>.*?</ul></div>"
          )
          replacement = (
              "<div class='release'><div class='release-top'><span class='release-v review'>v2.5 · 점검 중</span><span class='release-title'>Morning Briefing</span></div>"
              "<p><strong>현재 상태:</strong> 모닝 브리핑과 일반 분석 결과가 동일한 데이터 기준과 판단 체계를 사용하는지 확인하기 위해 잠시 점검 중입니다. 최근 출력에서 일부 종목의 가격·등락률·Edge·Risk가 실행 경로에 따라 다르게 보일 수 있는 사례가 있어, 원인을 확정하기 전 성급히 정상으로 간주하지 않고 데이터 일관성과 Live OOS 기록 영향까지 함께 검증하고 있습니다.</p>"
              "<p>점검은 기능 자체를 폐기하거나 분석 모델이 실패했다는 의미가 아니라, 자동 발송 정보의 기준을 일반 분석과 일치시키고 장기 검증 데이터의 신뢰도를 보호하기 위한 예방적 검증입니다. 원인 확인과 회귀 테스트가 완료된 뒤 정상 운영 상태로 다시 안내할 예정입니다.</p>"
              "<ul><li>매일 08:00 KST 관심종목 자동 브리핑</li><li>이전 결과 대비 Edge·Risk·판단·RS·Trend·Momentum 변화 비교</li><li>KR/US 혼합 관심종목과 각 시장의 실제 데이터 기준일 표시</li><li>동일 종목 중복 분석 제거, Python-only 메시지 생성으로 AI 호출 없이 동작</li><li>관리자 대시보드에서 독립 ON/OFF 지원</li></ul></div>"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('missing expected homepage fragment: v2.5 release details')

          replace_once(
              "<p>5·20·60 거래일 미래 성과가 실제로 쌓이기 전에는 결과를 확정하지 않으며, 자동 Calibration도 수행하지 않습니다.</p>",
              "<p><strong>Morning Briefing</strong>은 일반 분석과의 데이터 기준·판단 일관성 및 Live OOS 기록 영향을 확인하기 위해 잠시 점검 중입니다.</p><p>5·20·60 거래일 미래 성과가 실제로 쌓이기 전에는 결과를 확정하지 않으며, 자동 Calibration도 수행하지 않습니다.</p>",
              'current development direction',
          )

          # Guardrails: keep the rest of the homepage intact and require the new public notice.
          required = [
              "id='features'",
              "id='history'",
              "id='validation'",
              "id='guide'",
              "id='manual'",
              'v2.5 · 점검 중',
              'Live OOS 기록 영향',
              '모닝 브리핑 · 점검 중',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'homepage integrity check failed: {marker}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-morning-status.yml
          git commit -m "Mark Morning Briefing under data validation review"
          git push
